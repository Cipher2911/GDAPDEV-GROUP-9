<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0;">

    <div style="padding: 20px; background-color: #333; color: white;">
        <span style="font-size: 24px; font-weight: bold;">LOGO</span>
    </div>

    <div style="text-align: center; margin-top: 100px;">
        
        <h1>Welcome to Lab App</h1>
        <p>Please enter your details below.</p>
        <br>

        <form action="home.html">
            
            <label for="username"><strong>User Email:</strong></label><br>
            <input type="text" id="username" name="username" style="padding: 8px; width: 250px;">
            
            <br><br>

            <label for="password"><strong>Password:</strong></label><br>
            <input type="password" id="password" name="password" style="padding: 8px; width: 250px;">
            
            <br><br><br>

            <button type="submit" style="padding: 10px 30px; cursor: pointer; background-color: #007bff; color: white; border: none;">
                Log In
            </button>

        </form>

        <br><br>

    </div>

</body>
</html>
