<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="header">
        <span class="logo">YOUR LOGO</span>
        <a href="reserve.html" class="login-link">Back to Schedule</a>
    </div>

    <div class="container">
        
        <div class="profile-card">
            <div id="display-avatar" class="profile-avatar">--</div>
            
            <h2 id="name">Loading...</h2>
            
            <p class="profile-detail"><strong>Student ID:</strong> <span id="id_number">...</span></p>
            <p class="profile-detail"><strong>Department:</strong> <span id="college">...</span></p>
            <p class="profile-detail"><strong>Email:</strong> <span id="email">...</span></p>
            
            <p id="status" class="active">Active Student</p>
        </div>

        <hr class="divider">

        <h3>Current Reservations</h3>
        
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Lab Location</th>
                    <th>Station</th>
                    <th>Time Slot</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="location">-</td>
                    <td id="laboratory">-</td>
                    <td id="time">-</td>
                    <td id="status-label" class="status-reserved">-</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="functions.js"></script>

</body>
</html>
