<!DOCTYPE html>
<html>
<head>
    <title>AnimoSync: Search Free Slots</title>
    <link rel="stylesheet" href="styles.css"> 
    <style>
        .center-text { text-align: center; }
    </style>
</head>
<body>

    <div id="header">
        <span id="logo">YOUR LOGO</span>
        
        <div id="nav-links">
            <a href="user_profile.html" id="profile-link">View Profile</a>
            <a href="login.html" id="logout-link">Log Out</a>
        </div>

    </div>

    <div class="search-container">
        
        <h2>Search for Available Lab Slots</h2>
        <p>Find free computer stations by date, time, and location.</p>

        <div class="search-box">
            <form id="search-form">
                <div class="form-group">
                    <label for="search-date">Date:</label>
                    <input type="date" id="search-date" name="date">
                </div>

                <div class="form-group">
                    <label for="search-time">Time (Optional):</label>
                    <input type="time" id="search-time" name="time">
                </div>

                <div class="form-group">
                    <label for="search-lab">Lab:</label>
                    <select id="search-lab" name="lab">
                        <option value="all">All Labs</option>
                        <option value="lab-a">Computer Lab A (Science)</option>
                        <option value="lab-b">Computer Lab B (Library)</option>
                        <option value="mac-lab">Mac Lab (Design)</option>
                    </select>
                </div>

                <br>
                
                <button type="button" class="search-btn" onclick="filterSlots()">
                    Search Availability
                </button>
            </form>
        </div>

        <h3>Available Results</h3>
        
        <table class="results-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Time Slot</th>
                    <th>Lab Name</th>
                    <th>Station ID</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="results-body">
            </tbody>
        </table>

        <br><br>
        <a href="home.html">Back to Home</a>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="functions.js"></script>
   
</body>

</html>
