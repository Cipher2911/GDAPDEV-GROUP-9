<!DOCTYPE html>
<html>
<head>
    <title>AnimoSync: Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="header">
        <span id="logo">LOGO</span>
    </div>

    <div class="login-container">
        
        <h1>Create an Account</h1>
        <p>Join AnimoSync today!</p>
        <br>

        <form action="login.html">
            
            <label for="new-username">User Email:</label><br>
            <input type="email" id="new-username" name="username" class="form-input" required>
            
            <br><br>

            <label for="new-password">Password:</label><br>
            <input type="password" id="new-password" name="password" class="form-input" required>
            
            <br><br>

            <label for="confirm-password">Confirm Password:</label><br>
            <input type="password" id="confirm-password" name="confirm-password" class="form-input" required>
            
            <br><br><br>

            <button type="submit" class="submit-btn">
                Sign Up 
            </button>

        </form>

        <div class="signup-link">
            <p>Already have an account? <a href="login.html">Log In</a></p>
        </div>

        <br><br>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="functions.js"></script>
</body>
</html>
